# Summoner: code, not an agent. Exactly two kinds of immediate message, each to one named
# human: a gate ask (P1 spec approval or P6 acceptance) and a halt notice. Never polls
# humans, never messages agents, never decides anything.
name: summoner
on:
  issues:
    types: [labeled]
  pull_request:
    types: [labeled]
  push:
    branches: [main]
    paths: ["factory/HALT"]
concurrency:
  group: summoner-${{ github.event.issue.number || github.event.pull_request.number || github.sha }}
  cancel-in-progress: false
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  summon:
    if: >-
      github.event_name == 'push' ||
      contains(fromJSON('["needs-approval","needs-acceptance","factory:halt"]'), github.event.label.name)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # The factory:halt label and a push of factory/HALT are both a halt notice; summon.sh skips
      # a push whose commit no longer has factory/HALT (a lift is digest news, not a summons).
      - name: one message, one human
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK: ${{ secrets.SUMMONER_WEBHOOK }}
          SUMMONER_TO: ${{ vars.SUMMONER_TO }}
          KIND: ${{ (github.event_name == 'push' || github.event.label.name == 'factory:halt') && 'halt' || github.event.label.name }}
        run: ./factory/bin/summon.sh --apply --kind "$KIND"
