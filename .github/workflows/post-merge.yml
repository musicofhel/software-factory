# Ticket completion happens here, never on a node: .adlc is only written from main.
# post-merge.sh completes every ticket a merged commit names in a `Ticket:` trailer, appends the
# verified findings to factory/ledger/findings.jsonl and pushes one commit to main, the commit
# trailers `Ticket: post-merge`, `Node: github-actions`, `Assisted-by: none`.
# The push runs on the factory GitHub App's token (step-1 ruling Q6: the App is the ruleset bypass
# actor apply-branch-protection.sh adds) when vars.FACTORY_APP_ID is set and secrets.FACTORY_APP_KEY
# exists; otherwise on GITHUB_TOKEN, and the step summary says so. A push on GITHUB_TOKEN starts
# no other workflow; one on the App token starts this one again, which finds nothing new (its own
# commit names no ticket) and lands nothing. Either way the mirror job below re-labels the Issues
# itself (closes the completed tickets' Issues, lets their dependants become ready).
name: post-merge
on:
  push:
    branches: [main]
# One run at a time; a newer push replaces a pending run. Each run checks out main as it is when
# the job starts (not the pushed sha), so it sees the previous run's completion commit and covers
# every merge since the marker in factory/ledger/post-merge.json; a merge that lands mid-run makes
# its push non-fast-forward (exit 1) and that merge's own run picks the range up.
concurrency:
  group: post-merge
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
defaults:
  run:
    shell: bash
jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The secrets context cannot appear in a step's `if:`; its presence is read here.
    env:
      FACTORY_APP_ID: ${{ vars.FACTORY_APP_ID }}
      HAS_APP_KEY: ${{ secrets.FACTORY_APP_KEY != '' }}
    steps:
      # A configured App whose token cannot be minted fails the job: no silent fallback then.
      - name: mint the factory App token (ruleset bypass actor)
        id: app
        if: env.FACTORY_APP_ID != '' && env.HAS_APP_KEY == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_KEY }}
          permission-contents: write
      - name: no factory App configured, push on GITHUB_TOKEN
        if: steps.app.outcome == 'skipped'
        run: |
          echo "post-merge: FACTORY_APP_ID or FACTORY_APP_KEY is not set, so the completion commit is pushed on GITHUB_TOKEN (not a ruleset bypass actor; a protected main refuses it)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app.outputs.token || github.token }}
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: adlc ticket complete --write for every ticket the merged PRs carried; append ledger
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          set +e
          ./factory/bin/post-merge.sh --apply | tee -a "$GITHUB_STEP_SUMMARY"
          rc=${PIPESTATUS[0]}
          set -e
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
  mirror:
    needs: complete
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: mirror
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: re-mirror the store post-merge just wrote
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./factory/bin/mirror.sh --apply
