# Build gates. CI reruns every deterministic gate because a laptop is not a trust boundary.
# Hosted runners only on pull_request (fork safety). w:heavy jobs run on factory-node
# runners from `push` events on ticket/** branches, never on pull_request from a fork.
#
# The base is trusted, the head is data (I16, specs/factory-step3-v1 TB2). A gate job checks out the
# PR head (pull_request.head.sha, or merge_group.head_sha) as the working tree it inspects, and the
# BASE commit (pull_request.base.sha, or merge_group.base_sha) into ./.base, and runs the gate
# scripts from ./.base: a PR that edits a gate script or this file is still gated by the base's
# copy. factory/bin/lib/gate-context.sh resolves base, head, PR, ticket and PR class the same way
# for every gate; `context` prints them.
name: gates
on:
  pull_request:
    branches: [main]
  merge_group:
concurrency:
  group: gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: read
  security-events: write
env:
  GATE_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
  GATE_HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
jobs:
  context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.GATE_HEAD }}", fetch-depth: 0 }
      - uses: actions/checkout@v4
        with: { ref: "${{ env.GATE_BASE }}", path: .base }
      - name: base, head, PR, ticket and class (exit 2 refuses the PR)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: ./.base/factory/bin/lib/gate-context.sh
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: factory test suite (offline)
        run: make test
      - name: shellcheck
        run: make lint
  rails-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.GATE_HEAD }}", fetch-depth: 0 }
      - uses: actions/checkout@v4
        with: { ref: "${{ env.GATE_BASE }}", path: .base }
      - name: rails diff empty (build order 3 fills the rail paths from the ticket)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: ./.base/factory/bin/rails-proof.sh
  scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.GATE_HEAD }}", fetch-depth: 0 }
      - uses: actions/checkout@v4
        with: { ref: "${{ env.GATE_BASE }}", path: .base }
      - name: diff ⊆ ticket scope
        env: { GH_TOKEN: "${{ github.token }}" }
        run: ./.base/factory/bin/scope-check.sh
  tamper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: tamperguard (exit 2 fails the gate)
        run: pipx run tamperguard==0.2.0 --base origin/main
  dependencies:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
  commit-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.GATE_HEAD }}", fetch-depth: 0 }
      - uses: actions/checkout@v4
        with: { ref: "${{ env.GATE_BASE }}", path: .base }
      - name: Signed-off-by + Assisted-by trailers on every commit of a ticket branch
        env: { GH_TOKEN: "${{ github.token }}" }
        run: ./.base/factory/bin/commit-check.sh
  attest-verify:
    runs-on: ubuntu-latest
    needs: [build-test, rails-proof, scope, tamper, commit-check]
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.GATE_HEAD }}", fetch-depth: 0 }
      - uses: actions/checkout@v4
        with: { ref: "${{ env.GATE_BASE }}", path: .base }
      - name: gate manifest (attest verify is a required check; build order 3)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: ./.base/factory/bin/attest-verify.sh
